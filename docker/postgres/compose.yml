# The product's PostgreSQL, for every local run of the harness: one container,
# one named volume, bound to 127.0.0.1 only. See docs/PERSISTENCE.md.
#
# Started through scripts/postgres.sh, which hands this file `.env.local` for
# interpolation only: DATABASE_URL and DATABASE_URL_READONLY name the roles and
# the database to provision; nothing else from `.env.local` enters the container.
name: harness-postgres

services:
  postgres:
    # The official image, pulled anonymously from Docker Hub. Behind a Hub
    # rate limit, AWS's mirror serves the same one:
    # POSTGRES_IMAGE=public.ecr.aws/docker/library/postgres:16
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: harness-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      # Local only, never exposed beyond this machine.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.local}
      READONLY_DATABASE_URL: ${DATABASE_URL_READONLY:-}
      READONLY_ROLE: ${DATABASE_READONLY_ROLE:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is new; scripts/postgres.sh provision runs it again.
      - ./provision.sh:/docker-entrypoint-initdb.d/10-provision.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    name: harness-pgdata
