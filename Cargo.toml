[workspace]
resolver = "3"
# Dependency order: core ignores whoever uses it, and Cargo refuses to compile
# the reverse. Invariant #1 of the project, held by the crate graph rather than
# by a test. `view` is a second outer ring beside `launcher`: it reads what the
# harness leaves behind and never drives a session.
members = [
  "crates/core",
  "crates/workflows",
  "crates/launcher",
  "crates/view",
  "crates/view-render",
]
default-members = ["crates/launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# The arguments *and* their environment variables, declared together: the
# rule "every variable the code reads appears in `--help`" becomes true by
# construction, where the Python asserted it in a test.
clap = { version = "4", features = ["derive", "env"] }
# A clock, and it lives only in the launcher: `harness-core` has no dependency
# on time, because a ledger row receives its instant.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Dev only: tests mutate `std::env` to exercise `clap(env = …)`, and
# `cargo test` shares that state between threads. Without it, those tests
# sometimes read the environment another thread just set.
serial_test = "3"
thiserror = "2"
# Dev only: generative tests for parsers/validators with a non-trivial
# input space (e.g. domain::remote::Slug::parse).
proptest = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "macros",
  "process",
  "time",
  # Reading a child's pipes line by line while it runs, which is what makes
  # a session's execution log live rather than final.
  "io-util",
] }
# The factory view only. A local server for one human watching one plant, so
# HTTP/1 is enough; `json` and `query` are the two extractors it uses.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
# The steward's terminal: a pseudo-terminal for an interactive `claude`,
# bridged to the browser over the `ws` feature above.
portable-pty = { version = "0.9", default-features = false }
# `sync` alone: the only stream the view builds wraps a `tokio::sync::watch`.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
# Dev only: `ServiceExt::oneshot` drives the view's router in a test.
tower = { version = "0.5", default-features = false, features = ["util"] }
# The view's renderer: a Bevy scene compiled to WebAssembly. Features are
# chosen per target in `crates/view-render/Cargo.toml`.
bevy = { version = "0.19", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", default-features = false }
# Paints the plant's figures as 2D cut-outs at run time: a small pure-Rust
# rasterizer, no PNG or SIMD features — the textures never touch a file.
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
harness-core = { path = "crates/core" }
harness-workflows = { path = "crates/workflows" }

# The browser bundle: smallest code, longest build. `cargo build --profile
# wasm-release --target wasm32-unknown-unknown -p harness-view-render`, or
# `scripts/build-render.sh`, which also runs wasm-bindgen and wasm-opt.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The iteration build: Bevy and friends compiled once, optimised, and cached
# under target/; the renderer itself compiled fast; no LTO, no wasm-opt. A
# rebuild after a change in `crates/view-render` takes well under a minute
# against several for `wasm-release`, for a bundle a few times larger.
[profile.wasm-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = "debuginfo"

[profile.wasm-dev.package."*"]
opt-level = 3
