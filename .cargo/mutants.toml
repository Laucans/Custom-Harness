# cargo-mutants, the gate that judges the tests rather than the code
# (.github/workflows/ci.yml, `mutants`): each mutant is one function whose
# body is replaced by a plausible wrong one, and a test that still passes
# never tested that function. The CI runs the mutants of the lines a change
# touches (`--in-diff`); `cargo mutants --workspace -e main.rs` runs them all,
# which takes hours.
#
# What is not mutated: the entry points (`main.rs` wires, nothing tests
# wiring), the renderer (a Bevy scene, seen on a page and never asserted),
# and the fakes a test injects (a fake that lies makes the test fail, which
# is the test's finding, not the fake's).
# `harness-dataguard`'s in-memory store, notifier and clock are the fakes
# its tests inject (a lie there fails the engine's tests, the test's
# finding); its PostgreSQL store is judged against a real PostgreSQL only
# (`DATAGUARD_PG_URL`, an `#[ignore]`d test), not by the mutants.
exclude_globs = [
  "**/main.rs",
  "crates/view-render/**",
  "**/fake_*.rs",
  "crates/dataguard/src/memory.rs",
  "crates/dataguard/src/postgres.rs",
]

# The router's composition root: `dispatched` and the two helpers it hands
# an issue to (`refine_here`, `arbitrate_here`) build the concrete adapters
# and hand them to a workflow — wiring, like `main.rs`, that no unit test
# runs (it would spawn `gh` and `claude`). What it decides is `routing::decide`,
# which is mutated and tested.
# The null object of `harness-dataguard` (`NoProposer` proposes nothing):
# its body is what a mutant writes, so no test can tell the two apart.
exclude_re = [
  # Composition-root wiring with the real adapters (gh, git, the disk): the
  # logic they call is tested in `workflows`, the wiring itself has no fake.
  "dispatch/init_repo\\.rs:.*replace upgrade with \\(\\)",
  "router/mod\\.rs:.*delete ! in run",
  # The tick wires a snapshot read to the scheduler and the lanes: what it
  # decides is `pace`, `routing::schedule` and `routing::plan`, all tested.
  "router/mod\\.rs:.* in tick$",
  # The lanes spawn `harness` children: what they hand them is
  # `routing::lane_work`, `routing::splits` and `routing::building`, tested;
  # the spawning itself has no fake. `building_boards` reads one board per
  # milestone `routing::building` names.
  "router/lanes\\.rs:.*(replace (run_schedule|start_task|start_route)| in (run_schedule|start_task|start_route)$)",
  "router/mod\\.rs:.* in building_boards$",
  "router/routes\\.rs:.*replace run_dev_loop ",
  # `run_dev_loop` runs the loop on the milestone's branch, wired to real
  # adapters (`dev_loop::run`); the router holds a branch behind the base.
  "router/routes\\.rs:.* in run_dev_loop$",
  # A catch-up's wiring: a mounted checkout with a `GitCli`, the `Processes`
  # of the merged tree's own pin and `RealDisk` handed to `common::catch_up`
  # and `branching::catch_up_locally`, whose decisions are tested in
  # `workflows` against the fakes.
  "dispatch/catch_up\\.rs:",
  # The arms that run a paid workflow, here or on a lane: the workflow is
  # tested in `workflows`, the arm only wires the real adapters to it.
  "router/routes\\.rs:.*replace (fix_here|rules_here|contract_here|run_on_lane|run_main_agent_merge) ",
  "router/routes\\.rs:.* in dispatch$",
  "router/mod\\.rs:.*replace run_route ",
  # The toolchain's wiring to `gh` (the product's pin read on GitHub) and
  # `harness toolchain`'s printing: what they hand over is `resolve` and
  # `channel_of`, tested against folders a test builds.
  # `by_the_tree` hands `resolve` this process's own environment, unpinned.
  "toolchain\\.rs:.*(replace (at_watch_start|product_file|by_hand|by_the_tree) | in (at_watch_start|product_file|by_hand|by_the_tree)$)",
  # The snapshot's debug line, read by a human looking at a tick.
  "router/mod\\.rs:.*replace say_saw with \\(\\)",
  # Equivalent mutants: base64's bit groups never overlap, so `|` and `^`
  # agree; a milestone never consumes what it produces, so its own position
  # is never its producer's (`>` and `>=` agree), nor its own dependent
  # (`skip(i + 1)` and `skip(i * 1)` agree).
  "shell/github\\.rs:.*replace \\| with \\^ in base64$",
  # A board kept exactly `BOARD_KEPT_AT_MOST` long: a clock read never
  # lands on the bound to the nanosecond, so `<` and `<=` agree.
  "shell/github\\.rs:.*replace < with <= in GhCli::kept_through$",
  "architecture/src/graph\\.rs:.*replace > with >= in Graph::reads_ahead$",
  "architecture/src/graph\\.rs:.*replace \\+ with \\* in Graph::critical_path$",
  "router/routes\\.rs:.*replace (dispatched|refine_here|arbitrate_here) ",
  "dataguard/src/reconcile\\.rs:.*NoProposer",
]

# Every mutant runs the mutated crate's own tests, under the flags the CI
# tests with. Set for the build and the test alike (`all_features`, not
# `additional_cargo_test_args`, which reaches the test phase only: the build
# phase compiled without the features, and the test phase compiled them
# again inside its timeout). The CI tests with `--test-tool nextest`, and
# cargo-mutants hands the flag to `cargo nextest run` as to `cargo test`.
all_features = true

# A mutant that loops is caught by the clock: five times the baseline's
# test time, and never under 20 seconds. Each hung mutant costs at least that
# minimum, so it is kept low: the build is timed apart (cargo-mutants' build
# phase has no timeout of its own), so a cold cache is never read as a hang.
timeout_multiplier = 5
minimum_test_timeout = 20

# A test may read the repository it runs in: the copy a mutant is tested
# in keeps `.git`, as the CI's `--in-place` run does.
copy_vcs = true
