[package]
name = "harness-adapters"
description = "The harness's outside: git, gh, the claude CLI and the disk, one implementation per core port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
harness-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tokio.workspace = true
# The watch's sweep of the product's scratch databases (`shell/database`):
# the same client, version and runtime feature `harness-dataguard` locks.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# The free space of the lanes' volume (`shell/volume`): `statvfs` behind a
# safe wrapper. Already in the lockfile, through `tempfile`.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
