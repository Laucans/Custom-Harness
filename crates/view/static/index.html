<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness · factory</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="hud">
  <nav id="crumbs" aria-label="where you are"></nav>
  <button id="hud-steward" class="hud-btn" title="Talk to the steward — a Claude Code in the harness checkout, at the bottom left">🧙 steward</button>
  <button id="hud-doctor" class="hud-btn doctor" title="Call the doctor — a Claude Code that examines the plant, at the bottom left">🦞 doctor</button>
  <button id="hud-janitor" class="hud-btn janitor" title="The janitor — what the workspace weighs on disk, and a sweep of what is no longer useful">🧹 janitor</button>
  <div id="status-wrap">
    <button id="status" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="plant-menu" title="Start or stop the plant"><span id="watch-dot" class="dot"></span><span id="watch-text">connecting…</span><span class="caret" aria-hidden="true">▾</span></button>
    <div id="plant-menu" role="listbox" aria-label="plant switch" hidden></div>
  </div>
  <div id="factory-menu" role="dialog" aria-label="factories" hidden>
    <input id="fm-search" type="search" placeholder="Search a factory…" autocomplete="off" aria-label="search a factory">
    <div id="fm-list" role="listbox" aria-label="factories"></div>
    <div id="fm-note" class="note" hidden></div>
    <button id="fm-new" type="button">+ new factory</button>
  </div>
  <div id="help">drag to pan · wheel to zoom · click to enter · Esc to go back</div>
</header>
<main id="stage">
  <canvas id="scene"></canvas>
  <nav id="crew-bar" aria-label="agents at work"></nav>
  <div id="render-notice" class="notice" hidden></div>
  <div id="tooltip" hidden></div>
  <nav id="dock" aria-label="notifications"></nav>
</main>
<section id="factory-page" hidden aria-label="factory creation"></section>
<div id="action-errors" aria-live="assertive"></div>
<div id="action-log" hidden role="dialog" aria-label="an action's log">
  <div class="act-log-head"><b class="act-log-title"></b><span class="act-log-state"></span><button type="button" data-action-close aria-label="close" title="Close (Esc)">×</button></div>
  <pre></pre>
</div>
<div id="talk" hidden role="dialog" aria-label="an AI session">
  <div id="talk-head"><button type="button" id="talk-pin" title="Point at a part of the page: the window hides, click the part, its context is handed to this session (Esc cancels)" aria-label="point at a part of the page">📍</button><span id="talk-title"></span><span class="spacer"></span><span id="talk-status"></span><button type="button" id="talk-restart" class="mini" title="kill this Claude Code and start a fresh one">restart</button><button type="button" id="talk-ok" class="mini ok" title="close the session: its turns join the pin, the pin's text is compacted from them">✓ validate &amp; quit</button><button type="button" id="talk-drop" class="mini" title="close the session and drop what it said">✕ quit without validating</button><button type="button" id="talk-x" title="Close the window — the session keeps running, the button reopens it" aria-label="close the window">×</button></div>
  <div id="talk-chips" class="chips"></div>
  <div id="talk-term"></div>
  <div id="talk-grip" title="drag to resize"></div>
</div>
<div id="pick-layer" hidden aria-hidden="true"></div>
<div id="pick-box" hidden aria-hidden="true"></div>
<div id="pick-hint" hidden role="status"></div>
<aside id="pane" hidden>
  <div id="pane-head">
    <button id="pane-back" title="back to the pane you came from" aria-label="back" hidden>←</button>
    <h2 id="pane-title"></h2>
    <button id="pane-close" title="close (Esc)">×</button>
  </div>
  <div id="pane-body"></div>
</aside>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/clock.js"></script>
<script src="/actions.js"></script>
<script src="/board.js"></script>
<script src="/edit.js"></script>
<script src="/design.js"></script>
<script src="/data-model.js"></script>
<script src="/viewport.js"></script>
<script src="/mockup.js"></script>
<script src="/gallery.js"></script>
<script src="/kit.js"></script>
<script src="/creation.js"></script>
<script src="/factories.js"></script>
<script src="/app.js"></script>
</body>
</html>
