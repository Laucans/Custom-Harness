<!-- Checkbox: a group of options, several at once. -->
<style>
.kit-checkbox { display: grid; gap: var(--space-2, 8px); font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #111827); font-size: var(--font-size-base, 15px); }
.kit-checkbox legend { font-size: var(--font-size-small, 12px); color: var(--color-text-muted, #6b7280); text-transform: uppercase; letter-spacing: .06em; padding: 0; margin-bottom: var(--space-1, 4px); }
.kit-checkbox fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--space-2, 8px); }
.kit-checkbox label { display: flex; align-items: center; gap: var(--space-2, 8px); cursor: pointer; }
.kit-checkbox input { width: 18px; height: 18px; margin: 0; accent-color: var(--color-primary, #2b6cb0); border-radius: var(--radius-small, 4px); }
.kit-checkbox input:disabled + span { color: var(--color-text-muted, #6b7280); }
</style>
<div class="kit-checkbox">
  <fieldset>
    <legend>Notify me by</legend>
    <label><input type="checkbox" checked><span>Email</span></label>
    <label><input type="checkbox"><span>Text message</span></label>
    <label><input type="checkbox" disabled><span>Carrier pigeon</span></label>
  </fieldset>
</div>
