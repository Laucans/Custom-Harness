<!-- Input: a labelled text field, a hint, an error state, a disabled state. -->
<style>
.kit-input { display: grid; gap: var(--space-3, 16px); max-width: 360px; font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #111827); }
.kit-input label { display: grid; gap: var(--space-1, 4px); font-size: var(--font-size-small, 12px); color: var(--color-text-muted, #6b7280); text-transform: uppercase; letter-spacing: .06em; }
.kit-input input { font: inherit; font-size: var(--font-size-base, 15px); color: var(--color-text, #111827); padding: var(--space-2, 8px) var(--space-3, 16px); border: var(--border-width, 1px) solid var(--color-border, #d1d5db); border-radius: var(--radius-medium, 8px); background: var(--color-surface, #ffffff); }
.kit-input input:focus { outline: 2px solid var(--color-primary, #2b6cb0); outline-offset: 1px; border-color: var(--color-primary, #2b6cb0); }
.kit-input small { font-size: var(--font-size-small, 12px); text-transform: none; letter-spacing: 0; }
.kit-input .error input { border-color: var(--color-danger, #b91c1c); }
.kit-input .error small { color: var(--color-danger, #b91c1c); }
.kit-input input:disabled { background: var(--color-surface-2, #f3f4f6); color: var(--color-text-muted, #6b7280); }
</style>
<div class="kit-input">
  <label>Name<input type="text" placeholder="Jane Doe"><small>As it appears on the invoice.</small></label>
  <label class="error">Email<input type="email" value="jane@"><small>That is not an email address.</small></label>
  <label>Reference<input type="text" value="INV-2041" disabled></label>
</div>
