<!-- Table: a header row, striped rows, a numeric column aligned right. -->
<style>
.kit-table { width: 100%; border-collapse: collapse; font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #111827); font-size: var(--font-size-base, 15px); background: var(--color-surface, #ffffff); border: var(--border-width, 1px) solid var(--color-border, #d1d5db); border-radius: var(--radius-medium, 8px); overflow: hidden; }
.kit-table th, .kit-table td { text-align: left; padding: var(--space-2, 8px) var(--space-3, 16px); border-bottom: var(--border-width, 1px) solid var(--color-border, #d1d5db); }
.kit-table th { font-size: var(--font-size-small, 12px); color: var(--color-text-muted, #6b7280); text-transform: uppercase; letter-spacing: .06em; background: var(--color-surface-2, #f3f4f6); }
.kit-table tbody tr:nth-child(even) { background: var(--color-surface-2, #f3f4f6); }
.kit-table tbody tr:hover { background: var(--color-surface-2, #f3f4f6); filter: brightness(0.97); }
.kit-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.kit-table tr:last-child td { border-bottom: 0; }
</style>
<table class="kit-table">
  <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="num">Total</th></tr></thead>
  <tbody>
    <tr><td>#2041</td><td>Jane Doe</td><td>Shipped</td><td class="num">128.00</td></tr>
    <tr><td>#2040</td><td>Ada Lovelace</td><td>Paid</td><td class="num">1 240.50</td></tr>
    <tr><td>#2039</td><td>Grace Hopper</td><td>Pending</td><td class="num">64.90</td></tr>
  </tbody>
</table>
