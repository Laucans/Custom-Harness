<!-- Modal: a dialog over the page, opened by a button, closed by its buttons or Escape. -->
<style>
.kit-modal { font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #111827); }
.kit-modal > button { font: inherit; font-size: var(--font-size-base, 15px); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-medium, 8px); border: 0; background: var(--color-primary, #2b6cb0); color: var(--color-primary-contrast, #ffffff); cursor: pointer; }
.kit-modal .backdrop { position: fixed; inset: 0; background: var(--color-text, #111827); opacity: .45; z-index: 20; }
.kit-modal .dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(420px, 90vw); background: var(--color-surface, #ffffff); border-radius: var(--radius-large, 16px); box-shadow: var(--shadow-high, 0 8px 24px rgba(0, 0, 0, 0.18)); padding: var(--space-4, 24px); z-index: 21; display: grid; gap: var(--space-3, 16px); }
.kit-modal [hidden] { display: none; }
.kit-modal h2 { margin: 0; font-family: var(--font-family-heading, system-ui, sans-serif); font-size: var(--font-size-large, 20px); font-weight: var(--font-weight-heading, 700); }
.kit-modal p { margin: 0; color: var(--color-text-muted, #6b7280); font-size: var(--font-size-base, 15px); }
.kit-modal .actions { display: flex; justify-content: flex-end; gap: var(--space-2, 8px); }
.kit-modal .actions button { font: inherit; font-size: var(--font-size-base, 15px); padding: var(--space-2, 8px) var(--space-3, 16px); border-radius: var(--radius-medium, 8px); border: var(--border-width, 1px) solid var(--color-border, #d1d5db); background: var(--color-surface, #ffffff); color: var(--color-text, #111827); cursor: pointer; }
.kit-modal .actions .confirm { background: var(--color-danger, #b91c1c); border-color: var(--color-danger, #b91c1c); color: var(--color-primary-contrast, #ffffff); }
</style>
<div class="kit-modal">
  <button type="button" data-open>Delete the order…</button>
  <div class="backdrop" data-close hidden></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="kit-modal-title" hidden>
    <h2 id="kit-modal-title">Delete this order?</h2>
    <p>It leaves the list for good. The customer is not notified.</p>
    <div class="actions"><button type="button" data-close>Keep it</button><button type="button" class="confirm" data-close>Delete</button></div>
  </div>
</div>
<script>
(() => {
  const root = document.currentScript.closest('[data-kit]') || document.currentScript.parentElement;
  const show = (on) => { root.querySelector('.dialog').hidden = !on; root.querySelector('.backdrop').hidden = !on; };
  root.querySelector('[data-open]').addEventListener('click', () => show(true));
  root.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => show(false)));
  root.ownerDocument.addEventListener('keydown', (e) => { if (e.key === 'Escape') show(false); });
})();
</script>
