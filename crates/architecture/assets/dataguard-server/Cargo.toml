[package]
name = "dataguard-server"
version = "0.1.0"
edition = "2024"
description = "The product's write side, generic: the DataGuard engine planted with every unit the registry gathers, its routes, its applier, its migration. Installed by `harness init-repo`; the product's binary (`crates/server`) calls it."
publish = false

# The engine is the harness's, taken by git at a release tag (`dataguard-vN`,
# never moved): a product moves to a newer engine on purpose, in a change of
# its own. This line is the one place the tag is written: `scripts/register.sh`
# copies it into the registry's `Cargo.toml` and into the root `Cargo.toml`'s
# `[workspace.dependencies]`, whence a unit takes the engine with
# `harness-dataguard = { workspace = true }` — one source, so Cargo builds one
# engine and one `Plugin` type. `crates/server` reaches the engine through
# this crate (`dataguard_server::engine`). The product's units are not listed
# here: they are the registry's dependencies, which `scripts/register.sh`
# writes.
[dependencies]
harness-dataguard = { git = "https://github.com/laucans/custom-harness", tag = "dataguard-v4", features = ["postgres", "uuid"] }
dataguard-registry = { path = "../registry" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
