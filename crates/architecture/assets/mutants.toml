# cargo-mutants, the gate that judges the tests rather than the code —
# installed by `harness init-repo`; the repository owns it from here.
#
# Each mutant is one function whose body is replaced by a plausible wrong
# one; a test suite that still passes never tested that function. The CI
# (.github/workflows/ci.yml, job `mutants`, two shards) runs the mutants of
# the lines a change touches, and fails on any one no test catches. The whole
# workspace is `cargo mutants --workspace`, which takes as long as the
# workspace is large.
#
# Not mutated: the entry points — `main.rs` wires, and nothing tests wiring.
# Nor the write side's server and registry: the harness owns them, the
# product's copy is identical to the asset, and their tests run in the
# harness (`crates/architecture/tests/dataguard_server.rs`), not here —
# judged in a product, `migrate` and `router` look untested (ForgeDesMondes'
# M4, PR #335).
# A crate whose functions are seen rather than asserted (a renderer, a
# page) is added here, with the reason, in a task of its own.
exclude_globs = [
  "**/main.rs",
  "crates/dataguard/server/**",
  "crates/dataguard/registry/**",
]

# Every mutant runs the mutated crate's own tests, under the flags the CI
# tests with. Set for the build and the test alike (`all_features`, not
# `additional_cargo_test_args`, which reaches the test phase only: the build
# phase compiled without the features, and the test phase compiled them
# again inside its timeout). The CI tests with `--test-tool nextest`, and
# cargo-mutants hands the flag to `cargo nextest run` as to `cargo test`.
all_features = true

# A mutant that loops is caught by the clock: five times the baseline's
# test time, and never under 20 seconds. Each hung mutant costs at least that
# minimum, so it is kept low: the build is timed apart (cargo-mutants' build
# phase has no timeout of its own), so a cold cache is never read as a hang.
timeout_multiplier = 5
minimum_test_timeout = 20

# A test may read the repository it runs in: the copy a mutant is tested
# in keeps `.git`, as the CI's `--in-place` run does.
copy_vcs = true
