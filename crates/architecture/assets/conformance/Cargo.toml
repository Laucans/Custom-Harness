[package]
name = "platform-conformance"
version = "0.1.0"
edition = "2024"
description = "Runs a Concept's conformance fixtures against a Capability that implements it — a dev-dependency of every such Capability, installed by `harness init-repo`."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
