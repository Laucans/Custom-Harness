# The CI gates of the agent-native architecture — see docs/ARCHITECTURE.md,
# "CI gates". Installed by `harness init-repo`; the repository owns it from
# here. Every gate runs: a rule is in its name and its step, and a rule the
# product cannot keep yet is a task like any other, never a gate turned off.
#
# A gate is a step, whose `id` and `name` are the gate's id (a gate in
# several parts: `<gate>--<part>` for each part after the first). The jobs
# only group the gates by what they need installed — a job is a runner, and
# a pull request's runs share twenty of them per account. Within a job every
# gate runs whatever the others said (`!cancelled()`), the job fails if any
# of them failed, and its last step names the failed gates as annotations.
#
# The two branch patterns are the harness's: `main_agent` is where finished
# milestones land, `milestone/**` is what a task's pull request targets.
name: gates

on:
  push:
    branches: [main_agent, 'milestone/**']
  pull_request:
    branches: [main_agent, 'milestone/**']

jobs:
  # The gates that need bash, jq, git and psql, all on the runner: shell over
  # the manifests, and the registry's queries prepared against the migrated
  # schema (the one gate that needs Postgres, whose service costs seconds).
  # The whole history: `schema-impact` and `design-system-single-writer`
  # diff against the base.
  shell-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gates
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Contracts A, B — every Concept a Capability implements is documented:
      # `implements: Risk@3` ⇒ concepts/Risk/v3/concept.json names Risk, version 3.
      # Every implemented Concept has its concept.json.
      - id: concepts-documented
        name: concepts-documented
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for manifest in crates/**/capability.json; do
            ref=$(jq -r '.implements // empty' "$manifest")
            [ -n "$ref" ] || continue
            name=${ref%@*}; version=${ref##*@}
            file="concepts/$name/v$version/concept.json"
            if [ ! -f "$file" ] || [ "$(jq -r '.concept' "$file")" != "$name" ] || [ "$(jq -r '.version' "$file")" != "$version" ]; then
              echo "::error file=$manifest::implements $ref but $file does not document it"
              failed=1
            fi
          done
          exit $failed

      # Contract B — no Capability has write access. Checked where it can be,
      # statically: no write statement in a Capability crate, and no use of the
      # application role's connection — a Capability reads through
      # `DATABASE_URL_READONLY` only.
      # No Capability crate writes, nor opens the application role's connection.
      - id: read-only
        name: read-only
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for src in crates/*/capabilities/*/src/**/*.rs; do
            if grep -nEi '\b(INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[a-z_".]+[[:space:]]+SET|DELETE[[:space:]]+FROM|TRUNCATE|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE|CREATE[[:space:]]+TABLE)\b' "$src"; then
              echo "::error file=$src::a Capability writes nothing"
              failed=1
            fi
            if grep -nE 'DATABASE_URL\b' "$src" | grep -vE 'DATABASE_URL_READONLY'; then
              echo "::error file=$src::a Capability reads through DATABASE_URL_READONLY only"
              failed=1
            fi
          done
          exit $failed

      # Contract C — every read a Capability makes is a declared, persisted
      # query, registered under the Capability's id with its hash and the
      # fields it reads: `scripts/queries.sh` writes queries/registry.json from
      # the manifests' `reads`, and this gate refuses a registry that is not
      # what the script writes — a query changed, a `reads` entry points
      # nowhere, a query declares no fields. What the read crate serves is what
      # is registered.
      # queries/registry.json is what scripts/queries.sh writes.
      - id: queries-registered
        name: queries-registered
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/queries.sh --check

      # Contracts C, I — a migration that drops, renames or retypes a column
      # names the Capabilities that read it (from queries/registry.json), and
      # the same change must carry their queries: a reader left behind blocks.
      # A schema change carries every reader it touches.
      - id: schema-impact
        name: schema-impact
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          [ -f queries/registry.json ] || { echo "no registry: nothing to protect"; exit 0; }
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null || { echo "no base to compare with"; exit 0; }
          changed=$(git diff --name-only "$base" HEAD)
          norm() { tr '[:upper:]' '[:lower:]' <<< "$1" | tr -d '_'; }
          failed=0
          for migration in $(grep -E 'migrations/.*\.sql$' <<< "$changed" || true); do
            [ -f "$migration" ] || continue
            # table.column of every column removed, renamed or retyped.
            while IFS= read -r touched; do
              [ -n "$touched" ] || continue
              key=$(norm "$touched")
              while IFS=$'\t' read -r capability file fields; do
                for field in $fields; do
                  [ "$(norm "$field")" = "$key" ] || continue
                  if ! grep -qxF "$file" <<< "$changed"; then
                    echo "::error file=$migration::touches $touched, read by $capability through $file, which this change does not migrate"
                    failed=1
                  fi
                done
              done < <(jq -r '.queries[] | [.capability, .file, (.fields | join(" "))] | @tsv' queries/registry.json)
            done < <(awk '
              BEGIN { IGNORECASE = 1 }
              /alter[[:space:]]+table/ { match($0, /alter[[:space:]]+table[[:space:]]+(if[[:space:]]+exists[[:space:]]+)?[^[:space:]]+/); split(substr($0, RSTART, RLENGTH), w, /[[:space:]]+/); table = w[length(w)] }
              /drop[[:space:]]+column[[:space:]]+/ { match($0, /drop[[:space:]]+column[[:space:]]+(if[[:space:]]+exists[[:space:]]+)?[^[:space:],;]+/); split(substr($0, RSTART, RLENGTH), w, /[[:space:]]+/); print table "." w[length(w)] }
              /rename[[:space:]]+column[[:space:]]+/ { match($0, /rename[[:space:]]+column[[:space:]]+[^[:space:]]+/); split(substr($0, RSTART, RLENGTH), w, /[[:space:]]+/); print table "." w[3] }
              /alter[[:space:]]+column[[:space:]]+[^[:space:]]+[[:space:]]+(set[[:space:]]+data[[:space:]]+)?type/ { match($0, /alter[[:space:]]+column[[:space:]]+[^[:space:]]+/); split(substr($0, RSTART, RLENGTH), w, /[[:space:]]+/); print table "." w[3] }
              /drop[[:space:]]+table[[:space:]]+/ { match($0, /drop[[:space:]]+table[[:space:]]+(if[[:space:]]+exists[[:space:]]+)?[^[:space:],;]+/); split(substr($0, RSTART, RLENGTH), w, /[[:space:]]+/); print w[length(w)] ".*" }
            ' "$migration" | sed 's/"//g')
          done
          exit $failed

      # Rule 19 — a test's database is a `ScratchDb` (crates/platform/
      # scratch-db), whose guard drops it even when the test panics, times
      # out or is killed by cargo-mutants: a database created by hand is left
      # on the server by every such test. Scoped to the files the change
      # adds: the tests written before the guard move to it through a task
      # of their own, and editing one stays green. A test file is one under
      # a `tests/` folder, or a source holding a test.
      # A task's pull request only, measured from the merge base, as the
      # in-diff mutants: a milestone's own pull request adds every file its
      # tasks added — each judged on its own, some before this gate existed —
      # and a push only lands what a pull request already judged.
      # A test file this change adds creates no database by hand.
      - id: scratch-databases-shared
        name: scratch-databases-shared
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "${HEAD_REF:-}" in
            milestone/*) echo "a milestone's pull request: each of its tasks was judged on its own"; exit 0 ;;
          esac
          [ -n "${BASE:-}" ] && git cat-file -e "$BASE" 2>/dev/null || { echo "no base to compare with"; exit 0; }
          failed=0
          while IFS= read -r file; do
            case "$file" in
              crates/platform/scratch-db/*) continue ;;
              crates/*.rs) ;;
              *) continue ;;
            esac
            [ -f "$file" ] || continue
            case "$file" in
              */tests/*) ;;
              *) grep -qE '#\[(tokio::)?test|#\[cfg\(test\)\]' "$file" || continue ;;
            esac
            if grep -nEi 'CREATE[[:space:]]+DATABASE' "$file"; then
              echo "::error file=$file::a test takes its database from platform_scratch_db::ScratchDb::create(\"<label>\"), never CREATE DATABASE by hand: the guard drops it even when the test panics"
              failed=1
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE"...HEAD)
          exit $failed

      # Contract B — a Micro-UI's `needs` reference Capabilities that exist or
      # the plan declares, in any system: reading is free. (A shared Capability
      # that must behave differently is duplicated into a new id, never edited —
      # a review rule, not a static one.)
      # Every `needs` of a Micro-UI is a Capability that exists or is planned.
      - id: system-frontier
        name: system-frontier
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          system_of() {
            for m in crates/**/capability.json; do
              if [ "$(jq -r '.capability' "$m")" = "$1" ]; then jq -r '.system' "$m"; return; fi
            done
            # A Capability a milestone of the plan will produce (contract R) is
            # declared by the graph; its system is its namespace.
            if [ -e plan/graph.json ] && jq -e --arg id "$1" '.ids[$id] | select(.kind == "capability" and .producer != null)' plan/graph.json >/dev/null; then
              echo "${1%%.*}"
            fi
          }
          for ui in apps/**/micro-ui.json; do
            for need in $(jq -r '.needs[]? | if type=="string" then . else (.capability // empty) end' "$ui"); do
              found=$(system_of "$need")
              if [ -z "$found" ]; then
                echo "::error file=$ui::needs $need, which no capability.json declares"
                failed=1
              fi
            done
          done
          exit $failed

      # Contracts D, F — a Micro-UI's `actions` reference existing
      # DataCapabilities whose `callableBy` admits it: the Micro-UI's id, its
      # system, or `*`.
      # Every action of a Micro-UI is an existing DataCapability that admits it.
      - id: write-actions
        name: write-actions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          manifest_of() {
            for m in crates/**/data-capability.json; do
              if [ "$(jq -r '.dataCapability' "$m")" = "$1" ]; then echo "$m"; return; fi
            done
          }
          planned() {
            [ -e plan/graph.json ] && jq -e --arg id "$1" '.ids[$id] | select(.kind == "data-capability" and .producer != null)' plan/graph.json >/dev/null
          }
          for ui in apps/**/micro-ui.json; do
            me=$(jq -r '.microUi' "$ui"); system=$(jq -r '.system' "$ui")
            for action in $(jq -r '.actions[]? | if type=="string" then . else (.dataCapability // .id // empty) end' "$ui"); do
              manifest=$(manifest_of "$action")
              # A DataCapability a milestone of the plan will produce (contract R)
              # is declared by the graph; who may call it is the producer's to say.
              if [ -z "$manifest" ] && planned "$action"; then continue; fi
              if [ -z "$manifest" ]; then
                echo "::error file=$ui::action $action names no DataCapability"
                failed=1
                continue
              fi
              if ! jq -e --arg me "$me" --arg system "$system" '.callableBy | (index($me) != null) or (index($system) != null) or (index("*") != null)' "$manifest" >/dev/null; then
                echo "::error file=$ui::$action is not callable by $me — see callableBy in $manifest"
                failed=1
              fi
            done
          done
          exit $failed

      # Rule 2 — the units are workspace members by glob, never by name. A
      # glob matches what is on the disk: a sparse checkout that leaves a unit
      # out still resolves, and adding one edits no shared file. A unit named
      # in `members` would break both; a member named by name must be plumbing
      # (the server, the registry), which every checkout carries.
      # No Capability, DataCapability or aggregate is a workspace member by name.
      - id: workspace-members-by-glob
        name: workspace-members-by-glob
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f Cargo.toml ] || exit 0
          failed=0
          members=$(awk '/^[[:space:]]*members[[:space:]]*=[[:space:]]*\[/,/\]/' Cargo.toml | tr -d '[]"'"'"'' | tr ',' '\n' | sed -E 's/^[[:space:]]*members[[:space:]]*=//; s/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v '^$' || true)
          while read -r member; do
            [ -n "$member" ] || continue
            case "$member" in
              *\**) ;;
              crates/*/capabilities/*|crates/*/data-capabilities/*|crates/*/aggregates/*)
                echo "::error file=Cargo.toml::$member is a unit listed as a member by name — list units by glob (crates/*/capabilities/*, crates/*/data-capabilities/*, crates/*/aggregates/*), so a narrowed checkout resolves and adding one edits no shared file"
                failed=1 ;;
            esac
          done <<< "$members"
          exit $failed

      # Contract F — a DataCapability's folder is its id's namespace:
      # `campaign.saveEntity` sits under crates/campaign/data-capabilities/
      # save-entity/. The DataGuard owns every DataCapability (`owner`) and
      # houses none: crates/dataguard/data-capabilities/ is nobody's folder.
      # Every DataCapability sits under the system its id names.
      - id: data-capability-placed
        name: data-capability-placed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for manifest in crates/*/data-capabilities/*/data-capability.json; do
            folder=$(cut -d/ -f2 <<< "$manifest")
            name=$(cut -d/ -f4 <<< "$manifest")
            id=$(jq -r '.dataCapability // empty' "$manifest")
            if [ -z "$id" ]; then
              echo "::error file=$manifest::names no dataCapability"
              failed=1
              continue
            fi
            namespace=${id%%.*}
            if [ "$namespace" = "$id" ] || [ "$namespace" = "dataguard" ]; then
              echo "::error file=$manifest::$id names no system as its id's namespace — a DataCapability is <system>.<name>, under crates/<system>/data-capabilities/$name/; the DataGuard owns it, it is not its system"
              failed=1
              continue
            fi
            if [ "$folder" != "$namespace" ]; then
              echo "::error file=$manifest::$id belongs under crates/$namespace/data-capabilities/$name/, its id's namespace — the DataGuard owns a DataCapability (owner: dataguard), it does not house it"
              failed=1
            fi
          done
          exit $failed

      # Contract I — an aggregate's folder is in its system: `Account` sits
      # under crates/<system>/aggregates/Account/, the folder named after it. The
      # DataGuard judges every aggregate and houses none:
      # crates/dataguard/aggregates/ is nobody's folder. The system an aggregate
      # belongs in is the one the DataCapabilities that target it share.
      # Every aggregate sits under its system, in a folder named after it.
      - id: aggregate-placed
        name: aggregate-placed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          # The one system the DataCapabilities targeting $1 share, else <system>.
          system_of() {
            local found="" dc id namespace
            for dc in crates/*/data-capabilities/*/data-capability.json; do
              [ "$(jq -r '.target.aggregate // empty' "$dc")" = "$1" ] || continue
              id=$(jq -r '.dataCapability // empty' "$dc")
              namespace=${id%%.*}
              { [ -n "$id" ] && [ "$namespace" != "$id" ] && [ "$namespace" != "dataguard" ]; } || continue
              found="$found$namespace"$'\n'
            done
            found=$(printf '%s' "$found" | LC_ALL=C sort -u)
            if [ -n "$found" ] && [[ "$found" != *$'\n'* ]]; then echo "$found"; else echo "<system>"; fi
          }
          for manifest in crates/*/aggregates/*/aggregate.json; do
            folder=$(cut -d/ -f2 <<< "$manifest")
            name=$(cut -d/ -f4 <<< "$manifest")
            aggregate=$(jq -r '.aggregate // empty' "$manifest")
            if [ -z "$aggregate" ]; then
              echo "::error file=$manifest::names no aggregate"
              failed=1
              continue
            fi
            if [ "$folder" = "dataguard" ]; then
              echo "::error file=$manifest::$aggregate belongs under crates/$(system_of "$aggregate")/aggregates/$aggregate/, an aggregate's folder in its system — the DataGuard judges every aggregate, it houses none"
              failed=1
              continue
            fi
            if [ "$name" != "$aggregate" ]; then
              echo "::error file=$manifest::$aggregate belongs under crates/$folder/aggregates/$aggregate/, an aggregate's folder named after it"
              failed=1
            fi
          done
          exit $failed

      # Contract F — an `insert` DataCapability with empty `touches` contains no
      # update, upsert, delete or trigger in its implementation: a pure addition
      # takes the fast path, and must stay one.
      # A pure insert stays a pure insert.
      - id: effect-classification
        name: effect-classification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for manifest in crates/**/data-capability.json; do
            effect=$(jq -r '.effect // empty' "$manifest")
            touches=$(jq -r '.touches | length' "$manifest")
            { [ "$effect" = "insert" ] && [ "$touches" = "0" ]; } || continue
            dir=$(dirname "$manifest")
            for src in "$dir"/**/*.rs "$dir"/**/*.sql; do
              if grep -nEi '\b(UPDATE[[:space:]]+[a-z_".]+[[:space:]]+SET|ON[[:space:]]+CONFLICT|UPSERT|DELETE[[:space:]]+FROM|CREATE[[:space:]]+TRIGGER)\b' "$src"; then
                echo "::error file=$src::$(jq -r '.dataCapability' "$manifest") is declared a pure insert and must stay one"
                failed=1
              fi
            done
          done
          exit $failed

      # Contracts F, I — a DataCapability that mutates (`update`, `delete`,
      # `upsert`, or any `touches`) is owned by an aggregate: its target names an
      # aggregate.json, and every field it touches is one that aggregate
      # declares, and never one it declares `kind: derived` — a derived field is
      # recomputed, and the engine refuses a command that writes it. The human
      # review of such a change is the harness's, on the PR.
      # Every mutating DataCapability targets an aggregate that declares what it touches, and touches nothing derived.
      - id: ownership
        name: ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          aggregate_of() {
            for a in crates/**/aggregate.json; do
              if [ "$(jq -r '.aggregate' "$a")" = "$1" ]; then echo "$a"; return; fi
            done
          }
          for manifest in crates/**/data-capability.json; do
            effect=$(jq -r '.effect // empty' "$manifest")
            touches=$(jq -r '.touches | length' "$manifest")
            { [ "$effect" != "insert" ] || [ "$touches" != "0" ]; } || continue
            target=$(jq -r '.target.aggregate // empty' "$manifest")
            aggregate=$(aggregate_of "$target")
            if [ -z "$aggregate" ]; then
              echo "::error file=$manifest::mutates $target, which no aggregate.json declares"
              failed=1
              continue
            fi
            for field in $(jq -r '.touches[]?' "$manifest"); do
              key=${field#*.}
              if ! jq -e --arg f "$key" '.fields | has($f)' "$aggregate" >/dev/null; then
                echo "::error file=$manifest::touches $field, which $aggregate does not declare"
                failed=1
              elif jq -e --arg f "$key" '.fields[$f].kind == "derived"' "$aggregate" >/dev/null; then
                echo "::error file=$manifest::touches $field, which $aggregate declares derived — recomputed, never written (the engine refuses it)"
                failed=1
              fi
            done
          done
          exit $failed

      # Contracts F, I — every invariant an aggregate declares is named in a
      # test, and every invariant a DataCapability lists is one its target
      # aggregate declares.
      # Every invariant has a test, and every listed invariant exists.
      - id: invariants-tested
        name: invariants-tested
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          declared() {
            for a in crates/**/aggregate.json; do
              if [ "$(jq -r '.aggregate' "$a")" = "$1" ]; then jq -r '.invariants[].id' "$a"; return; fi
            done
          }
          for aggregate in crates/**/aggregate.json; do
            # The aggregate's own system: crates/<system>/aggregates/<Aggregate>/aggregate.json.
            system_dir=$(dirname "$(dirname "$(dirname "$aggregate")")")
            for id in $(jq -r '.invariants[].id' "$aggregate"); do
              tested=0
              for src in "$system_dir"/**/*.rs; do
                case "$src" in */tests/*) ;; *) grep -qE '#\[(tokio::)?test\]' "$src" || continue ;; esac
                if grep -qF "$id" "$src"; then tested=1; break; fi
              done
              if [ "$tested" = "0" ]; then
                echo "::error file=$aggregate::invariant $id is named in no test of $system_dir — the aggregate's own system tests its invariants"
                failed=1
              fi
            done
          done
          for manifest in crates/**/data-capability.json; do
            target=$(jq -r '.target.aggregate // empty' "$manifest")
            known=$(declared "$target")
            for id in $(jq -r '.invariants[]?' "$manifest"); do
              if ! printf '%s\n' "$known" | grep -qxF "$id"; then
                echo "::error file=$manifest::lists invariant $id, which aggregate $target does not declare"
                failed=1
              fi
            done
          done
          exit $failed

      # Contracts D, E — every Micro-UI a frozen screen lays out exists: its id
      # is the `microUi` of a micro-ui.json.
      # Every Micro-UI of a frozen screen exists.
      - id: compositions-resolve
        name: compositions-resolve
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for screen in apps/screens/*.json; do
            for id in $(jq -r '(.layout[]? | strings), (.layout | .. | objects | .microUi? // empty)' "$screen" | sort -u); do
              found=0
              for ui in apps/**/micro-ui.json; do
                if [ "$(jq -r '.microUi' "$ui")" = "$id" ]; then found=1; break; fi
              done
              if [ "$found" = "0" ]; then
                echo "::error file=$screen::lays out $id, which no micro-ui.json declares"
                failed=1
              fi
            done
          done
          exit $failed

      # Contract O — the design system has one writer. `mock/design/` and
      # `mock/kit/` are read-only outside the `design-system` branch of this
      # repository: it writes them, the harness carries them onto `main_agent`
      # when the human publishes, and every branch in progress finds them on its
      # next sync. A pull request from any other branch that adds, changes,
      # deletes or renames anything under them fails here, one annotation per
      # protected path (both sides of a rename), measured from the merge base.
      # Pull requests only: a push — the publish being carried — is not gated.
      # The exemption is judged in the script, so a fork's `design-system`
      # branch still runs and fails; every value reaches the script through
      # `env:`, never through `${{ }}` in its body.
      # A pull request leaves mock/design/ and mock/kit/ to the design-system branch.
      - id: design-system-single-writer
        name: design-system-single-writer
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" = "design-system" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "design-system branch of $BASE_REPO: the design system's one writer"
            exit 0
          fi
          # Fail closed: a diff that cannot be computed is never an empty one.
          fail() { echo "::error::$1"; exit 1; }
          # A path is a property of the annotation: escape what would end it.
          escape() {
            local s=$1
            s=${s//'%'/'%25'}
            s=${s//$'\r'/'%0D'}
            s=${s//$'\n'/'%0A'}
            s=${s//':'/'%3A'}
            s=${s//','/'%2C'}
            printf '%s' "$s"
          }
          [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] \
            || fail "the pull request's base or head commit is unknown: the diff cannot be computed"
          [ "$(git rev-parse --is-shallow-repository)" = false ] \
            || fail "the history is shallow: the merge base cannot be trusted, the diff cannot be computed"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") \
            || fail "no merge base between $BASE_SHA and $HEAD_SHA: the diff cannot be computed"
          [ -n "$merge_base" ] || fail "empty merge base: the diff cannot be computed"
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          # --no-renames lists both sides of a rename; -z keeps odd names whole;
          # the folders without their slash also catch a file put in their place.
          git diff --no-renames --name-only -z "$merge_base" "$HEAD_SHA" -- mock/design mock/kit > "$changed" \
            || fail "git diff failed: the diff cannot be computed"
          offenders=0
          while IFS= read -r -d '' file; do
            case "$file" in mock/design|mock/design/*|mock/kit|mock/kit/*) ;; *) continue ;; esac
            echo "::error file=$(escape "$file")::mock/design/ and mock/kit/ are read-only outside the design-system branch"
            offenders=$((offenders + 1))
          done < "$changed"
          if [ "$offenders" -gt 0 ]; then
            echo "$offenders protected path(s) changed by a pull request into $BASE_REF"
            exit 1
          fi

      # Contract C — every persisted SQL query of the registry prepares against
      # the schema this checkout's migrations build (expand/contract: a column a
      # query reads must exist after the migrations of this very commit). GraphQL
      # queries are the read crate's to validate; they pass here.
      # Every registered SQL query prepares against the migrated schema.
      - id: queries-valid
        name: queries-valid
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PGPASSWORD: gates
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          [ -f queries/registry.json ] || { echo "no registry: nothing to validate"; exit 0; }
          psql="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -q"
          while IFS= read -r migration; do
            [ -n "$migration" ] || continue
            $psql -f "$migration" || { echo "::error file=$migration::the migration does not apply"; exit 1; }
          done < <(git ls-files -- '*migrations/*.sql' | LC_ALL=C sort)
          failed=0
          n=0
          while IFS=$'\t' read -r capability file; do
            case "$file" in *.sql) ;; *) continue ;; esac
            [ -f "$file" ] || { echo "::error file=$file::registered under $capability but absent"; failed=1; continue; }
            n=$((n + 1))
            body=$(grep -v '^[[:space:]]*--' "$file" | sed 's/;[[:space:]]*$//')
            if ! $psql -c "PREPARE gate_q_$n AS $body" > /dev/null 2> err.txt; then
              echo "::error file=$file::$capability reads through a query the schema refuses: $(tail -n 1 err.txt)"
              failed=1
            fi
          done < <(jq -r '.queries[] | [.capability, .file] | @tsv' queries/registry.json)
          exit $failed

      # Every gate above ran, whatever the others said; a red job names here
      # the gates that failed (a step's id is its gate's, `--` a part of it).
      - name: Failing gates
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r 'to_entries[] | select(.value.outcome == "failure") | .key | sub("--.*$"; "")' <<< "$STEPS" \
            | sort -u \
            | while read -r gate; do echo "::error title=$gate::the gate $gate failed, its step says why"; done

  # The gates that run on node: the contracts' schemas (ajv), the contracts
  # and rules gates' scripts, the mock-up's. The whole history:
  # `contracts-untouched` and `rule-tests-untouched` diff against the base.
  # `rule-tests-untouched` opens the `Rules contested` issue, hence
  # `issues: write`. `pages-mocked` comes last: its second part rebuilds
  # the bundles in the checkout, which no other gate may read.
  node-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Contracts A, B, D, E, F, I — every manifest validates against its schema.
      # Validate every manifest against its contract.
      - id: manifests-conform-to-contracts
        name: manifests-conform-to-contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          validate() {
            local schema="contracts/$1"; shift
            for file in "$@"; do
              # A literal path is not a glob: nullglob keeps it when absent.
              [ -e "$file" ] || continue
              echo "::group::$file against $schema"
              npx --yes ajv-cli@5 validate --spec=draft2020 -s "$schema" -d "$file"
              echo "::endgroup::"
            done
          }
          validate a-concept.schema.json concepts/**/concept.json
          validate b-capability-manifest.schema.json crates/**/capability.json
          validate d-micro-ui-manifest.schema.json apps/**/micro-ui.json
          validate e-screen-composition.schema.json apps/screens/*.json
          validate f-data-capability.schema.json crates/**/data-capability.json
          validate i-aggregate.schema.json crates/**/aggregate.json
          # The aggregates drafted at the factory's creation conform before any is built.
          validate i-aggregate.schema.json mock/data/aggregates/*.aggregate.json
          validate c-persisted-query.schema.json queries/registry.json
          validate m-data-model.schema.json data/model.json
          validate n-mock-pages.schema.json mock/pages.json
          validate q-ports.schema.json ports.json
          validate r-plan-graph.schema.json plan/graph.json

      # Contract R — a milestone changes the interfaces it produces, and no
      # other's: a `capability.json` or `data-capability.json` whose id the
      # plan's graph gives another milestone is not this change's to touch. A
      # consumer that needs a contract to change stops with
      # `AGENT_LOOP_STOP: contract <id> — <what it needs>`; the contract manager
      # evolves it for every consumer at once (scripts/contracts-gate.mjs).
      # Every contract changed is this milestone's own.
      - id: contracts-untouched
        name: contracts-untouched
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          node scripts/contracts-gate.mjs untouched "origin/${GITHUB_BASE_REF}"

      # Contract O — the mock-up styles itself only through the design system:
      # no colour literal in a page, a micro-frontend, `style.css` or `mock.js`
      # (a hex, a colour function, a named colour; a fallback in `var()` too), no
      # `var(--color-*|--font-*|--space-*|--radius-*|--shadow-*|--border-width)`
      # that mock/design/tokens.css does not define, every page loading
      # `tokens.css`, `kit.css` and `style.css` in that order from the design
      # system's own files and never from a copy, and no `<link`, `@import` or
      # external `url(` anywhere else. Files are found by glob under `mock/`
      # (mock/design/ and mock/kit/ excluded, being the design system's own); the
      # gate fails on an empty scan, reports every violation and gives its verdict
      # last (scripts/design-system-gate.mjs, proved in the harness by
      # crates/architecture/tests/design_system_gate.rs). Every push and pull request,
      # no `paths:` filter: a rule of the mock-up is never skipped.
      # The mock-up styles only through the design system's tokens and loads its files once.
      - id: design-system
        name: design-system
        if: ${{ !cancelled() }}
        run: node scripts/design-system-gate.mjs

      # Contract Q — every dependency outside the product is a port: the units
      # name theirs and each port lists them back, a Capability never reads a
      # stateful one, and every port has its fake and its contract tests.
      # The ports and the units that use them agree.
      - id: ports-declared
        name: ports-declared
        if: ${{ !cancelled() }}
        run: node scripts/ports-gate.mjs declared
      # Every port has its fake and its contract tests.
      - id: ports-declared--contracts
        name: ports-declared--contracts
        if: ${{ !cancelled() }}
        run: node scripts/ports-gate.mjs contracts

      # Contract Q — nothing reaches outside the product but through a port's
      # adapter: no HTTP client, provider SDK or database client elsewhere, no
      # network call from a Micro-UI. What keeps ports.json true.
      # Nothing reaches outside the product but through a port.
      - id: externals-behind-ports
        name: externals-behind-ports
        if: ${{ !cancelled() }}
        run: node scripts/ports-gate.mjs behind

      # Contract Q — the ports' secrets are committed encrypted with sops, or
      # not at all.
      # Every committed secret is sops-encrypted.
      - id: secrets-encrypted
        name: secrets-encrypted
        if: ${{ !cancelled() }}
        run: node scripts/ports-gate.mjs secrets

      # Contract P — every rule of rules.json has its test, of its family, its
      # criterion copied as it is (scripts/rules-gate.mjs coverage).
      # Every rule has its test, its criterion copied as it is.
      - id: rules-covered
        name: rules-covered
        if: ${{ !cancelled() }}
        run: node scripts/rules-gate.mjs coverage

      # Contract P — only the rules' task (label harness:rules) writes rules.json
      # and the rules' tests: a development conforms to them, or contests them
      # with CONTEST.md — which opens a `Rules contested` issue for the rules'
      # task, and holds the change until it is settled.
      # The rules and their tests are left alone.
      - id: rule-tests-untouched
        name: rule-tests-untouched
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'harness:rules') }}
        run: node scripts/rules-gate.mjs untouched "origin/${{ github.base_ref }}"
      # No rule's test is contested.
      - id: rule-tests-untouched--contest
        name: rule-tests-untouched--contest
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'harness:rules') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rules-gate.mjs contest "${{ github.event.pull_request.number }}"

      # Contract N — the mock server's handlers are one file per unit,
      # mock/handlers/<id>.js, keyed by its own id only, and no id is defined
      # twice: not twice in one literal (the later key silently wins — it hid a
      # payload mismatch once), not in its file and in the legacy
      # mock/src/reads.js / commands.js. Once mock/handlers/ holds a handler
      # file (not its README, not _lib/), a pull request adds no handler to
      # the legacy files, whose handlers stay
      # editable until scripts/split-handlers.mjs splits them; two branches
      # adding handlers then touch no common file (scripts/mock-handlers-gate.mjs).
      # No handler is defined twice, and a new one gets its own file.
      - id: mock-handlers
        name: mock-handlers
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/mock-handlers-gate.mjs ${BASE:+"$BASE"}

      # Contracts E, N — the mock-up keeps up with the screens: every page
      # `mock/pages.json` lists is there, and every frozen screen under
      # `apps/screens/` has a page that names it. The mock-up is where a screen
      # is designed and annotated before it is built; a screen without one was
      # built blind.
      # Every listed page and micro-frontend exists, every frozen screen and every Micro-UI is mocked.
      - id: pages-mocked
        name: pages-mocked
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          manifest=mock/pages.json
          if [ ! -f "$manifest" ]; then
            if compgen -G "apps/screens/*.json" > /dev/null; then
              echo "::error file=$manifest::the mock-up has no pages.json, and there are screens to mock"
              exit 1
            fi
            exit 0
          fi
          for page in $(jq -r '.pages[].path' "$manifest"); do
            if [ ! -f "mock/$page" ]; then
              echo "::error file=$manifest::lists $page, which is not under mock/"
              failed=1
            fi
          done
          for fragment in $(jq -r '.components[]?.fragment' "$manifest"); do
            if [ ! -f "mock/$fragment" ]; then
              echo "::error file=$manifest::lists the micro-frontend $fragment, which is not under mock/"
              failed=1
            fi
          done
          # Before any Micro-UI is built, a hand-written micro-frontend already names its parts
          # (contract D) and reads one fixture per Capability it needs, fixtures/<Capability>.json —
          # what the mock server answers it with and the rules' tests start from.
          for name in $(jq -r '.components[]? | select((.source // "") == "") | .name' "$manifest"); do
            entry=$(jq -c --arg n "$name" '.components[] | select(.name == $n)' "$manifest")
            fragment=$(jq -r '.fragment // empty' <<< "$entry")
            [ -n "$fragment" ] && [ -f "mock/$fragment" ] || continue
            text=$(tr '\n' ' ' < "mock/$fragment")
            for key in actions needs; do
              attr=reads
              [ "$key" = actions ] && attr=writes
              for unit in $(jq -r --arg k "$key" '.[$k][]?' <<< "$entry"); do
                if ! grep -qiE "data-$attr[^;]{0,160}${unit//./\\.}" <<< "$text"; then
                  echo "::error file=$manifest::the micro-frontend $name names no part data-$attr=\"$unit\" in mock/$fragment (contract D)"
                  failed=1
                fi
              done
            done
            for need in $(jq -r '.needs[]?' <<< "$entry"); do
              if ! jq -e --arg f "fixtures/$need.json" '.fixtures // [] | index($f)' <<< "$entry" > /dev/null; then
                echo "::error file=$manifest::the micro-frontend $name needs $need and lists no fixtures/$need.json"
                failed=1
              fi
            done
            for fixture in $(jq -r '.fixtures[]?' <<< "$entry"); do
              if [ ! -f "mock/$fixture" ]; then
                echo "::error file=$manifest::the micro-frontend $name lists $fixture, which is not under mock/"
                failed=1
              fi
            done
          done
          for name in $(jq -r '[.pages[].components[]?] | unique[]' "$manifest"); do
            if ! jq -e --arg n "$name" '.components[]? | select(.name == $n)' "$manifest" > /dev/null; then
              echo "::error file=$manifest::a page injects $name, a micro-frontend components does not list"
              failed=1
            fi
          done
          for screen in apps/screens/*.json; do
            name=$(jq -r '.screen' "$screen")
            if ! jq -e --arg s "$name" '.pages[] | select(.screen == $s)' "$manifest" > /dev/null; then
              echo "::error file=$screen::screen $name has no page in $manifest — mock it first"
              failed=1
            fi
          done
          for ui in apps/**/micro-ui.json; do
            name=$(jq -r '.microUi' "$ui")
            fragment=$(jq -r --arg n "$name" '.components[]? | select(.name == $n) | .fragment' "$manifest")
            if [ -z "$fragment" ]; then
              echo "::error file=$ui::the Micro-UI $name has no micro-frontend in $manifest — mock it: its real code on the mock server"
              failed=1
              continue
            fi
            if [ ! -f "mock/$fragment" ]; then
              echo "::error file=$manifest::the micro-frontend $name has no fragment at mock/$fragment"
              failed=1
              continue
            fi
            # Its parts are named (contract D): each action tied to an actuator, each need to a part that shows it.
            # A hand-written fragment names the unit in the attribute itself; the real code's bundle reaches
            # it through its identifiers (one file names them), so it carries the attribute and the unit's id.
            bundle="mock/${fragment%.html}.js"
            text=$(tr '\n' ' ' < "mock/$fragment")
            if [ -f "$bundle" ]; then text="$text $(tr '\n' ' ' < "$bundle")"; fi
            for key in actions needs; do
              attr=reads
              [ "$key" = actions ] && attr=writes
              for unit in $(jq -r --arg k "$key" '.[$k][]? | if type=="string" then . else (.capability // .dataCapability // .id // empty) end' "$ui"); do
                if [ -f "$bundle" ]; then
                  named=0
                  grep -qE "(data-$attr|dataset\.$attr)" <<< "$text" && grep -qiF "$unit" <<< "$text" && named=1
                else
                  named=0
                  grep -qiE "(data-$attr|dataset\.$attr)[^;]{0,160}${unit//./\\.}" <<< "$text" && named=1
                fi
                if [ "$named" = 0 ]; then
                  echo "::error file=$ui::the micro-frontend $name names no part data-$attr=\"$unit\" — tie the part that does it to its unit (contract D)"
                  failed=1
                fi
              done
            done
            # The listing says the same needs and actions as the manifest.
            for key in needs actions; do
              ours=$(jq -c --arg k "$key" '[.[$k][]? | if type=="string" then . else (.capability // .dataCapability // .id // empty) end] | sort' "$ui")
              theirs=$(jq -c --arg n "$name" --arg k "$key" '[.components[]? | select(.name == $n) | .[$k][]?] | sort' "$manifest")
              if [ "$ours" != "$theirs" ]; then
                echo "::error file=$manifest::the micro-frontend $name lists other $key than $ui — keep the listing in sync"
                failed=1
              fi
            done
          done
          exit $failed
      # The bundles are the real Micro-UIs' code: a change under apps/ or
      # mock/src/ without a rebuild would show stale code on the easel. The
      # `builtFrom` digests in mock/pages.json are part of the build — a
      # bundle whose code came out the same but whose digest is stale let a
      # milestone land, and two branches rebuilding it later collided there.
      # The micro-frontends' bundles are rebuilt from the Micro-UIs' code.
      - id: pages-mocked--bundles
        name: pages-mocked--bundles
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f mock/build.sh ] || exit 0
          [ -f package.json ] && npm ci --no-audit --no-fund --loglevel=error
          sh mock/build.sh
          if ! git diff --exit-code --stat -- mock/components mock/pages.json; then
            echo "::error file=mock/build.sh::the bundles under mock/components/ or their builtFrom in mock/pages.json are stale — run mock/build.sh and commit them"
            exit 1
          fi

      # Every gate above ran, whatever the others said; a red job names here
      # the gates that failed (a step's id is its gate's, `--` a part of it).
      - name: Failing gates
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r 'to_entries[] | select(.value.outcome == "failure") | .key | sub("--.*$"; "")' <<< "$STEPS" \
            | sort -u \
            | while read -r gate; do echo "::error title=$gate::the gate $gate failed, its step says why"; done

  # The gates that need cargo: the dependency graph `cargo metadata` answers,
  # and the conformance tests, last, the one that compiles.
  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Contract B, principle 5 — a slice knows no other slice. Checked on the
      # graph `cargo metadata` answers, not on a Cargo.toml's text: a Capability
      # or a DataCapability reaches no other one, directly or transitively, and
      # only crates of its own system; what it depends on is plumbing, never a
      # bridge; no inclusion leaves a slice's folder (scripts/isolation.sh).
      # A slice depends on no other slice, and only on its own system's plumbing.
      - id: capability-isolation
        name: capability-isolation
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/isolation.sh
      # No Capability manifest names an `invokes` field.
      - id: capability-isolation--invokes
        name: capability-isolation--invokes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for manifest in crates/**/capability.json; do
            if grep -q '"invokes"' "$manifest"; then
              echo "::error file=$manifest::a Capability invokes nothing"
              failed=1
            fi
          done
          exit $failed

      # Contract F, rule 2 — a unit is a folder, never an edit of a shared file.
      # Every crate under crates/<system>/{aggregates,data-capabilities,
      # capabilities}/ is named in the registry's Cargo.toml, which
      # scripts/register.sh writes and nobody edits: the registry's build script
      # turns them into the plugins the server plants. A DataCapability's library
      # is named after its folder, an aggregate's `aggregate_<snake>`: the glue
      # calls them by that name. Two units added in parallel meet nowhere but in
      # that generated file, which merges by running the script again. One
      # engine: a unit takes harness-dataguard from the workspace
      # (`{ workspace = true }`), whose [workspace.dependencies] line the script
      # copies from the server's — two sources would build two engines.
      # Every unit crate is registered, a member, and named as the registry calls it.
      - id: units-registered
        name: units-registered
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          units=(crates/*/aggregates/*/Cargo.toml crates/*/data-capabilities/*/Cargo.toml crates/*/capabilities/*/Cargo.toml)
          # No Rust workspace yet: nothing to register, unless a unit waits on one.
          if [ ! -f Cargo.toml ]; then
            for toml in "${units[@]}"; do
              echo "::error file=$toml::there is no root Cargo.toml — list the unit folders by glob in one"
              failed=1
            done
            exit $failed
          fi
          # The registry is the script's, line for line.
          if [ ${#units[@]} -gt 0 ] || [ -f crates/dataguard/registry/Cargo.toml ]; then
            if [ ! -f scripts/register.sh ]; then
              echo "::error file=scripts/register.sh::missing — the registry is what it writes: run bash scripts/register.sh"
              failed=1
            elif ! bash scripts/register.sh --check; then
              failed=1
            fi
          fi
          # `AiSettings` as `ai_settings`, as the registry's build script spells it.
          snake() { LC_ALL=C sed -E 's/([a-z0-9])([A-Z])/\1_\2/g; s/-/_/g' <<< "$1" | tr '[:upper:]' '[:lower:]'; }
          metadata=$(cargo metadata --format-version 1 --no-deps)
          root=$(jq -r '.workspace_root' <<< "$metadata")
          for toml in crates/*/aggregates/*/Cargo.toml crates/*/data-capabilities/*/Cargo.toml; do
            dir=$(dirname "$toml")
            folder=$(basename "$dir")
            case "$toml" in
              crates/*/aggregates/*) expected="aggregate_$(snake "$folder")"; what=aggregate ;;
              *) expected=${folder//-/_}; what=DataCapability ;;
            esac
            if ! jq -e --arg m "$root/$toml" '.packages[] | select(.manifest_path == $m)' <<< "$metadata" > /dev/null; then
              echo "::error file=$toml::$dir is not a workspace member — list the unit folders by glob in the root Cargo.toml"
              failed=1
              continue
            fi
            lib=$(jq -r --arg m "$root/$toml" '.packages[] | select(.manifest_path == $m) | .targets[] | select(.kind[] == "lib") | .name' <<< "$metadata")
            if [ "$lib" != "$expected" ]; then
              echo "::error file=$toml::the library of the $what $folder is named $lib — name it $expected: the registry's glue calls it by that name"
              failed=1
            fi
          done
          exit $failed

      # Contracts A, B — `implements: Risk@3` ⇒ the Concept's fixtures pass
      # against this Capability. The runner is crates/platform/conformance
      # (installed): a Capability that implements a Concept has a test that
      # calls `platform_conformance::check("<Concept>@<n>", …)`, and that test
      # runs here, crate by crate. A Capability with no such test fails: a
      # Concept it claims and never proves is a copy nobody can check.
      # Every Capability that implements a Concept passes its fixtures.
      - id: semantic-conformance
        name: semantic-conformance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          failed=0
          for manifest in crates/*/capabilities/*/capability.json; do
            ref=$(jq -r '.implements // empty' "$manifest")
            [ -n "$ref" ] || continue
            dir=$(dirname "$manifest")
            if ! grep -rqF 'platform_conformance::check' "$dir"/src "$dir"/tests 2>/dev/null; then
              echo "::error file=$manifest::implements $ref and has no test calling platform_conformance::check(\"$ref\", …) — the Concept is claimed, never proved"
              failed=1
              continue
            fi
            name=$(grep -m1 -E '^\s*name\s*=' "$dir/Cargo.toml" | sed -E 's/^[^"]*"([^"]*)".*/\1/')
            if ! cargo test -p "$name" -- conformance; then
              echo "::error file=$manifest::$ref: the conformance fixtures fail against $name"
              failed=1
            fi
          done
          exit $failed

      # Every gate above ran, whatever the others said; a red job names here
      # the gates that failed (a step's id is its gate's, `--` a part of it).
      - name: Failing gates
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r 'to_entries[] | select(.value.outcome == "failure") | .key | sub("--.*$"; "")' <<< "$STEPS" \
            | sort -u \
            | while read -r gate; do echo "::error title=$gate::the gate $gate failed, its step says why"; done

  # Contract P — the rules hold: a rule's test runs once every unit it needs
  # is built and the runtime serves the product, and must pass; a rule marked
  # `conform` may stay red in a task, never where a milestone lands.
  rules-hold:
    runs-on: ubuntu-latest
    # The store the runtime builds its scratch database on, as in ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Serve the product for the rules' tests.
      - id: rules-hold--serve
        name: rules-hold--serve
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rules-runtime.sh serve | tee rules-env
          cat rules-env >> "$GITHUB_ENV"
      # The business rules hold.
      - id: rules-hold
        name: rules-hold
        shell: bash
        env:
          RULES_STATUS: ${{ github.workspace }}/target/rules-status.jsonl
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/rules/business/tests/*.rs)
          if [ -f tests/rules/business/Cargo.toml ] && [ ${#tests[@]} -gt 0 ]; then
            cargo test --manifest-path tests/rules/business/Cargo.toml
          fi
      # The journey rules hold.
      - id: rules-hold--journey
        name: rules-hold--journey
        if: always()
        shell: bash
        env:
          RULES_STATUS: ${{ github.workspace }}/target/rules-status.jsonl
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          specs=(tests/rules/journey/**/*.spec.ts)
          if [ ${#specs[@]} -gt 0 ]; then
            cd tests/rules/journey
            npm install --no-audit --no-fund
            if [ -n "${RULES_APP_URL:-}" ]; then npx playwright install --with-deps chromium; fi
            npx playwright test
          fi
      # Each rule's state.
      - id: rules-hold--status
        name: rules-hold--status
        if: always()
        shell: bash
        env:
          RULES_STATUS: ${{ github.workspace }}/target/rules-status.jsonl
          # Strict where a milestone lands (its pull request into main_agent),
          # never on the rules' own change: a changed rule's test lands red.
          STRICT: ${{ github.event_name == 'pull_request' && github.base_ref == 'main_agent' && !contains(github.event.pull_request.labels.*.name, 'harness:rules') && '--strict' || '' }}
        run: node scripts/rules-gate.mjs status $STRICT
      # Stop the product.
      - id: rules-hold--stop
        name: rules-hold--stop
        if: always()
        run: bash scripts/rules-runtime.sh stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-status
          path: rules-status.json
          if-no-files-found: ignore
      # A red job names here the gate that failed (a step's id is its gate's,
      # `--` a part of it).
      - name: Failing gates
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r 'to_entries[] | select(.value.outcome == "failure") | .key | sub("--.*$"; "")' <<< "$STEPS" \
            | sort -u \
            | while read -r gate; do echo "::error title=$gate::the gate $gate failed, its step says why"; done
